<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f6fb" />
  <title>ورود به حساب کاربری</title>

  <style>
    :root {
      --primary: #635bff;
      --primary-dark: #5048e5;
      --text: #202235;
      --muted: #777b91;
      --border: #e5e7ef;
      --background: #f4f6fb;
      --white: #ffffff;
      --shadow: 0 24px 70px rgba(36, 42, 76, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 15%, rgba(99, 91, 255, 0.11), transparent 28%),
        radial-gradient(circle at 88% 85%, rgba(62, 193, 176, 0.11), transparent 25%),
        var(--background);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    .login-card {
      width: min(100%, 440px);
      padding: 40px;
      background: var(--white);
      border: 1px solid rgba(229, 231, 239, 0.8);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
      font-size: 19px;
      font-weight: 700;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, #817aff, var(--primary));
      border-radius: 12px;
      font-size: 18px;
    }

    .heading {
      margin-bottom: 28px;
      text-align: center;
    }

    .heading h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.5;
    }

    .heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    .form-group { margin-bottom: 19px; }

    .form-group label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #fcfcfe;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .form-group input::placeholder { color: #a4a7b6; }

    .form-group input:focus {
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.12);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 23px;
      font-size: 13px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .submit-button,
    .google-button {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .submit-button {
      border: 0;
      color: var(--white);
      background: var(--primary);
      box-shadow: 0 8px 18px rgba(99, 91, 255, 0.2);
    }

    .submit-button:hover {
      transform: translateY(-1px);
      background: var(--primary-dark);
      box-shadow: 0 11px 22px rgba(99, 91, 255, 0.28);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: #a0a3b2;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      content: "";
      background: var(--border);
    }

    .google-button {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--white);
      font-weight: 600;
    }

    .google-button:hover { background: #f9f9fc; }

    .google-letter {
      font-family: Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      background: conic-gradient(
        from -45deg,
        #4285f4 0deg 90deg,
        #34a853 90deg 180deg,
        #fbbc05 180deg 250deg,
        #ea4335 250deg 310deg,
        #4285f4 310deg
      );
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .signup-text {
      margin: 24px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .signup-text a {
      margin-right: 4px;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card {
        padding: 30px 22px;
        border-radius: 20px;
      }
      .heading h1 { font-size: 23px; }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand" aria-label="نام برند">
      <span class="brand-icon" aria-hidden="true">ن</span>
      <span>نُوا</span>
    </div>

    <header class="heading">
      <h1>خوش برگشتی!</h1>
      <p>برای ورود به حساب کاربری‌ات اطلاعات زیر را وارد کن.</p>
    </header>

    <form action="#" method="post">
      <div class="form-group">
        <label for="email">ایمیل</label>
        <input id="email" name="email" type="email"
               placeholder="name@example.com"
               autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password"
               placeholder="رمز عبورت را وارد کن"
               autocomplete="current-password" required />
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" name="remember" />
          مرا به خاطر بسپار
        </label>
        <a href="#">رمز عبورت را فراموش کردی؟</a>
      </div>

      <button class="submit-button" type="submit">ورود به حساب</button>

      <div class="divider">یا ورود با</div>

      <button class="google-button" type="button">
        <span class="google-letter" aria-hidden="true">G</span>
        ادامه با گوگل
      </button>

      <p class="signup-text">
        هنوز حساب کاربری نداری؟
        <a href="#">ثبت‌نام کن</a>
      </p>
    </form>
  </main>
</body>
</html>
